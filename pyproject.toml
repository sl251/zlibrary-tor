[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zlibrary-tor"
version = "0.2.0"
description = "JSON CLI and agent skill for the Z-Library E-API through Tor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx[socks]>=0.28.1,<1", "certifi>=2026.10.19"]

[project.scripts]
zlibrary-tor = "zlibrary_tor:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools]
py-modules = ["zlibrary_tor"]
package-dir = {"" = "scripts"}

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

